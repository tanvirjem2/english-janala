<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Title & Logo -->

    <title>English Janala | Learn English with Interactive Lessons</title>
    <link rel="shortcut icon" href="./assets/logo.png" type="image/x-icon">

    <!-- Font awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
        integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />

    <!-- Tailwind & DaisyUI -->
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <!-- Font Integration -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@300;400;500;600;700&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
        rel="stylesheet">

    <!-- Link CSS -->
    <link rel="stylesheet" href="./style/style.css">
</head>

<body>

    <!-- Header Section -->

    <header>
        <div class="navbar bg-[#edf7ff] shadow-sm">

            <!-- Navbar Start -->
            <div class="navbar-start">
                <div class="dropdown lg:hidden">
                    <button class="btn btn-ghost">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24"
                            stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M4 6h16M4 12h8m-8 6h16" />
                        </svg>
                    </button>

                    <ul class="menu menu-sm dropdown-content bg-base-100 rounded-box mt-3 w-52 p-2 shadow">
                        <li><a href="#"><i class="fa-solid fa-circle-question"></i> FAQ</a></li>
                        <li><a href="#"><i class="fa-solid fa-book-open"></i> Learn</a></li>
                        <li><a href="#"><i class="fa-solid fa-arrow-right-from-bracket"></i> Logout</a></li>
                    </ul>
                </div>

                <a href="#" class="flex items-center gap-1">
                    <span class="text-lg font-bold">English</span>
                    <img src="./assets/logo.png" alt="Logo">
                    <span class="font-bangla text-lg font-semibold">জানালা</span>
                </a>
            </div>

            <!-- Navbar End -->
            <div class="navbar-end hidden lg:flex">
                <ul class="menu menu-horizontal gap-4">
                    <li>
                        <a href="#" class="btn btn-outline btn-primary">
                            <i class="fa-solid fa-circle-question"></i>
                            FAQ
                        </a>
                    </li>
                    <li>
                        <a href="#" class="btn btn-outline btn-primary">
                            <i class="fa-solid fa-book-open"></i>
                            Learn
                        </a>
                    </li>
                    <li>
                        <a href="#" class="btn btn-outline btn-primary">
                            <i class="fa-solid fa-arrow-right-from-bracket"></i>
                            Logout
                        </a>
                    </li>
                </ul>
            </div>

        </div>
    </header>

    <section class="flex flex-col-reverse lg:flex-row items-center 
                justify-between gap-10 
                py-12 lg:py-20
                w-11/12 max-w-7xl mx-auto">

        <!-- Content -->
        <div class="flex-1 space-y-6 text-center lg:text-left">

            <!-- Heading -->
            <h2 class="font-bold text-3xl sm:text-4xl lg:text-5xl leading-tight">
                <span class="text-[#00BCFF]">English</span>
                is Easy!!
            </h2>

            <!-- Description -->
            <p class="font-bangla font-medium 
                  text-base sm:text-lg lg:text-xl 
                  max-w-xl mx-auto lg:mx-0">
                আজ থেকেই আপনার ভাষা শেখার যাত্রা শুরু করুন।
                আপনি যদি নতুন হন অথবা আপনার দক্ষতা বাড়াতে চান,
                আমাদের Interactive Lessons আপনাকে নিয়ে যাবে
                অন্য একটি Level এ
            </p>

            <!-- Form -->
            <form class="flex flex-col sm:flex-row 
                     gap-4 
                     max-w-xl mx-auto lg:mx-0">

                <input type="text" placeholder="Enter Your Name" class="input input-bordered w-full" />

                <input type="password" placeholder="Enter Your Password" class="input input-bordered w-full" />

                <button class="btn btn-primary w-full sm:w-auto">
                    Get Started
                </button>

            </form>
        </div>

        <!-- Image -->
        <div class="flex-1">
            <img src="./assets/hero-student.png" alt="Student learning English"
                class="w-full max-w-md lg:max-w-lg mx-auto">
        </div>

    </section>

</body>

</html>
